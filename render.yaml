services:
  - type: web
    name: zipview-real-estate-platform
    runtime: python
    plan: free
    rootDir: zipview-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MOLIT_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://zip-view-rose.vercel.app
