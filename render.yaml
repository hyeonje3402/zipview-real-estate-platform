services:
  - type: web
    name: zipview-real-estate-platform
    runtime: python
    plan: free
    rootDir: zipview-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MOLIT_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LISTING_ADMIN_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash-lite
      - key: ALLOWED_ORIGINS
        value: https://zip-view-rose.vercel.app
